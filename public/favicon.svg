    <path d="M40 49H46C47.657 49 49 47.657 49 46V40" />

    <!-- Center Facial Features -->
    <circle cx="26" cy="27" r="2.2" fill="#00F5A0" stroke="none" />
    <circle cx="38" cy="27" r="2.2" fill="#00F5A0" stroke="none" />
